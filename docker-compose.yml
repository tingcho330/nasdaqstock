# 이 스택 전체의 프로젝트/리소스 이름 접두사
name: nasdaq_stack

x-common: &common
  build:
    context: .
  restart: always
  env_file:
    - ./config/.env
  environment:
    # Optional build identity (container usually has no .git). Unset → unavailable, never fails.
    APP_GIT_COMMIT: ${APP_GIT_COMMIT:-}
    APP_IMAGE_TAG: ${APP_IMAGE_TAG:-}
    APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    APP_VERSION: ${APP_VERSION:-}
  volumes:
    - ./src:/app/src
    - ./config:/app/config
    - ./output:/app/output

services:
  integrated_manager:
    <<: *common
    container_name: nasdaq_trading_bot_integrated
    command: python /app/run_integrated_manager.py
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  background_risk_manager:
    <<: *common
    container_name: nasdaq_trading_bot_risk_manager
    command: python /app/run_background_risk_manager.py
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
